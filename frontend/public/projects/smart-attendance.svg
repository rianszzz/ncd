<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12161b" />
      <stop offset="100%" stop-color="#090d12" />
    </linearGradient>
    <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg2)" />
  <!-- Circuit grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="640" y2="90" />
    <line x1="0" y1="180" x2="640" y2="180" />
    <line x1="0" y1="270" x2="640" y2="270" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
  </g>

  <!-- Attendance Card Frame -->
  <g transform="translate(60, 40)">
    <rect width="520" height="280" rx="10" fill="#151b22" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    <!-- Header -->
    <rect width="520" height="36" rx="10" fill="#1c2430" />
    <rect y="26" width="520" height="10" fill="#1c2430" />
    <circle cx="20" cy="18" r="4.5" fill="#EF4444" fill-opacity="0.8" />
    <circle cx="36" cy="18" r="4.5" fill="#F59E0B" fill-opacity="0.8" />
    <circle cx="52" cy="18" r="4.5" fill="#10B981" fill-opacity="0.8" />
    <text x="260" y="22" fill="#8892a0" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">nexa-smart-attendance / live-scanner</text>

    <!-- QR Code Graphic Mockup -->
    <g transform="translate(36, 60)">
      <rect width="180" height="180" rx="8" fill="#0d1117" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.5" />
      <!-- Stylized QR blocks -->
      <rect x="20" y="20" width="40" height="40" rx="4" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="2" />
      <rect x="28" y="28" width="24" height="24" fill="#10B981" />
      
      <rect x="120" y="20" width="40" height="40" rx="4" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="2" />
      <rect x="128" y="28" width="24" height="24" fill="#10B981" />

      <rect x="20" y="120" width="40" height="40" rx="4" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="2" />
      <rect x="28" y="128" width="24" height="24" fill="#10B981" />

      <!-- QR Pattern bits -->
      <rect x="75" y="25" width="16" height="16" fill="#06B6D4" />
      <rect x="95" y="45" width="16" height="16" fill="#10B981" />
      <rect x="75" y="75" width="30" height="30" rx="4" fill="#10B981" />
      <rect x="120" y="75" width="16" height="16" fill="#06B6D4" />
      <rect x="35" y="75" width="16" height="16" fill="#06B6D4" />
      <rect x="75" y="120" width="16" height="16" fill="#10B981" />
      <rect x="100" y="140" width="36" height="16" fill="#06B6D4" />
      <rect x="145" y="120" width="15" height="36" fill="#10B981" />

      <!-- Scanner line -->
      <line x1="10" y1="90" x2="170" y2="90" stroke="#10B981" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Info side -->
    <g transform="translate(240, 60)">
      <rect width="244" height="52" rx="6" fill="#0d1117" stroke="#ffffff" stroke-opacity="0.05" />
      <text x="16" y="24" fill="#717a8a" font-family="system-ui, sans-serif" font-size="10">Geofence Radius</text>
      <text x="16" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">15m Accurate (GPS + Wi-Fi)</text>

      <rect y="64" width="244" height="52" rx="6" fill="#0d1117" stroke="#ffffff" stroke-opacity="0.05" />
      <text x="16" y="88" fill="#717a8a" font-family="system-ui, sans-serif" font-size="10">Dynamic TOTP Hash</text>
      <text x="16" y="106" fill="#10B981" font-family="monospace" font-size="13" font-weight="600">SHA-256 / 5s TTL</text>

      <rect y="128" width="244" height="52" rx="6" fill="#0d1117" stroke="#ffffff" stroke-opacity="0.05" />
      <text x="16" y="152" fill="#717a8a" font-family="system-ui, sans-serif" font-size="10">Anti-Spoofing Protocol</text>
      <text x="16" y="170" fill="#06B6D4" font-family="system-ui, sans-serif" font-size="14" font-weight="600">WebRTC Device ID Verified</text>
    </g>
  </g>
</svg>
