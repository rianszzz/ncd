      <g transform="translate(0, 72)">
        <rect width="472" height="114" rx="6" fill="#120e1a" stroke="#ffffff" stroke-opacity="0.05" />
        <path d="M20 90 L80 75 L140 82 L200 50 L260 55 L320 30 L380 35 L440 18" stroke="url(#amberGrad)" stroke-width="3" fill="none" stroke-linecap="round" />
        <circle cx="440" cy="18" r="5" fill="#F59E0B" stroke="#ffffff" stroke-width="2" />
        <text x="24" y="28" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Rating: 2,148 (Candidate Master)</text>
        <text x="24" y="44" fill="#7d748a" font-family="system-ui, sans-serif" font-size="10">Active practice: Dynamic Programming, Segment Trees, Max Flow</text>
