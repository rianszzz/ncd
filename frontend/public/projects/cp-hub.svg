      <stop offset="0%" stop-color="#16131d" />
      <stop offset="100%" stop-color="#0e0b14" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg3)" />
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="640" y2="90" />
    <line x1="0" y1="180" x2="640" y2="180" />
    <line x1="0" y1="270" x2="640" y2="270" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
  </g>

  <!-- Hub Window Frame -->
  <g transform="translate(60, 40)">
    <rect width="520" height="280" rx="10" fill="#1b1724" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    <!-- Header -->
    <rect width="520" height="36" rx="10" fill="#241e30" />
    <rect y="26" width="520" height="10" fill="#241e30" />
    <circle cx="20" cy="18" r="4.5" fill="#EF4444" fill-opacity="0.8" />
