    <circle cx="52" cy="18" r="4.5" fill="#10B981" fill-opacity="0.8" />
    <text x="260" y="22" fill="#958da1" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">competitive-programming-hub / arena</text>

    <!-- Leaderboard / Problemset rows -->
    <g transform="translate(24, 56)">
      <rect width="472" height="60" rx="6" fill="#120e1a" stroke="#ffffff" stroke-opacity="0.05" />
      <circle cx="30" cy="30" r="14" fill="#F59E0B" fill-opacity="0.2" />
      <text x="30" y="34" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">#1</text>
      <text x="60" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Gemastik 2026 Competitive Division</text>
      <text x="60" y="46" fill="#7d748a" font-family="system-ui, sans-serif" font-size="10">Delegasi NCD • 12 Problems Solved • Accepted (0.04s)</text>
