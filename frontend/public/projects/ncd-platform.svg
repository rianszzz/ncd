<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151a" />
      <stop offset="100%" stop-color="#0b0c0e" />
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6456EB" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6456EB" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6456EB" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="640" height="360" fill="url(#bg1)" />
  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="60" x2="640" y2="60" />
    <line x1="0" y1="120" x2="640" y2="120" />
    <line x1="0" y1="180" x2="640" y2="180" />
    <line x1="0" y1="240" x2="640" y2="240" />
    <line x1="0" y1="300" x2="640" y2="300" />
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
  </g>
  <!-- Glow spot -->
  <circle cx="320" cy="180" r="160" fill="url(#glow)" filter="blur(40px)" />
  
  <!-- Window mockup -->
  <g transform="translate(60, 40)">
    <rect width="520" height="280" rx="10" fill="#181920" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    <!-- Window header -->
    <rect width="520" height="36" rx="10" fill="#20222b" />
    <rect y="26" width="520" height="10" fill="#20222b" />
    <circle cx="20" cy="18" r="4.5" fill="#EF4444" fill-opacity="0.8" />
    <circle cx="36" cy="18" r="4.5" fill="#F59E0B" fill-opacity="0.8" />
    <circle cx="52" cy="18" r="4.5" fill="#10B981" fill-opacity="0.8" />
    <text x="260" y="22" fill="#888c99" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">ncd-integrated-platform / main</text>
    
    <!-- Code / Dashboard UI layout -->
    <rect x="24" y="56" width="140" height="70" rx="6" fill="#111216" stroke="#ffffff" stroke-opacity="0.05" />
    <text x="36" y="78" fill="#717582" font-family="system-ui, sans-serif" font-size="10">API Latency (p99)</text>
    <text x="36" y="104" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">14.2ms</text>
    <path d="M110 100 L125 90 L135 94 L150 82" stroke="#10B981" stroke-width="2" stroke-linecap="round" fill="none" />
    
    <rect x="180" y="56" width="150" height="70" rx="6" fill="#111216" stroke="#ffffff" stroke-opacity="0.05" />
    <text x="192" y="78" fill="#717582" font-family="system-ui, sans-serif" font-size="10">Maker-Checker Kas</text>
    <text x="192" y="104" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">100%</text>
    <rect x="270" y="88" width="46" height="18" rx="4" fill="#6456EB" fill-opacity="0.2" />
    <text x="293" y="101" fill="#8B5CF6" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">AUDITED</text>

    <rect x="346" y="56" width="150" height="70" rx="6" fill="#111216" stroke="#ffffff" stroke-opacity="0.05" />
    <text x="358" y="78" fill="#717582" font-family="system-ui, sans-serif" font-size="10">Stack Decoupled</text>
    <text x="358" y="104" fill="#6456EB" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Go + React 19</text>

    <!-- Content area: Architecture graph mockup -->
    <rect x="24" y="142" width="472" height="114" rx="6" fill="#111216" stroke="#ffffff" stroke-opacity="0.05" />
    <line x1="24" y1="199" x2="496" y2="199" stroke="#ffffff" stroke-opacity="0.03" />
    <path d="M40 220 C100 160, 160 230, 220 180 C280 130, 360 210, 420 160 L480 170" stroke="url(#accent1)" stroke-width="3" fill="none" stroke-linecap="round" />
    <circle cx="220" cy="180" r="4" fill="#6456EB" stroke="#ffffff" stroke-width="2" />
    <circle cx="420" cy="160" r="4" fill="#8B5CF6" stroke="#ffffff" stroke-width="2" />
    <text x="40" y="168" fill="#9CA3AF" font-family="monospace" font-size="11">GET /api/v1/public/projects 200 OK • 1.2MB/s</text>
  </g>
